name: Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Check Android SDK
        run: |
          if [[ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" || ! -x "$ANDROID_HOME/build-tools/35.0.0/aapt2" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          fi
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.11.1'
      - run: gradle --no-daemon :app:lintDebug :app:assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk quiet-depth.apk
      - uses: actions/upload-artifact@v6
        with:
          name: quiet-depth-apk
          path: quiet-depth.apk
          if-no-files-found: error
