name: Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Check Android SDK
        run: |
          if [[ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" || ! -x "$ANDROID_HOME/build-tools/35.0.0/aapt2" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          fi
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.11.1'
      - run: gradle --no-daemon :app:lintDebug :app:assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk quiet-depth.apk
      - uses: actions/upload-artifact@v6
        with:
          name: quiet-depth-apk
          path: quiet-depth.apk
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: quiet-depth-apk
      - name: Publish the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" quiet-depth.apk \
            --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease \
            --title "Тихая глубина ${GITHUB_REF_NAME#v}" \
            --notes 'Скачайте и откройте quiet-depth.apk на телефоне. Требуется Android 7.0 или новее с обновлённым Android System WebView. APK собран в GitHub Actions и подписан отладочным ключом.'
