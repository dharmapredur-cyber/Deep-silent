plugins {
    id 'com.android.application'
}

android {
    namespace 'com.silentdepth.game'
    compileSdk 35

    defaultConfig {
        applicationId 'com.silentdepth.game'
        minSdk 24
        targetSdk 35
        versionCode 6
        versionName '1.4.1'
    }

    androidResources {
        noCompress += 'ogg'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
